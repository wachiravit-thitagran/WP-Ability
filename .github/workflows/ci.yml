name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.1', '8.3']

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer

      - name: Validate PHP syntax
        run: find . -type f -name '*.php' -not -path './vendor/*' -print0 | xargs -0 -n1 php -l

      - name: Install development dependencies
        if: matrix.php == '8.1'
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate Composer metadata
        if: matrix.php == '8.1'
        run: composer validate --strict

      - name: Audit Composer dependencies
        if: matrix.php == '8.1'
        run: composer audit --no-interaction

      - name: Run WordPress Coding Standards
        if: matrix.php == '8.1'
        run: composer lint

      - name: Run PHPStan
        if: matrix.php == '8.1'
        run: composer analyse

  phpunit:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: wordpress_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli
          tools: composer

      - name: Install development dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Install WordPress 6.9 test environment
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion
          svn export --quiet https://core.svn.wordpress.org/tags/6.9/ /tmp/wordpress
          svn export --quiet https://develop.svn.wordpress.org/tags/6.9/tests/phpunit/ /tmp/wordpress-tests-lib
          curl -fsSL https://develop.svn.wordpress.org/tags/6.9/wp-tests-config-sample.php -o /tmp/wordpress-tests-lib/wp-tests-config.php
          sed -i "s/youremptytestdbnamehere/wordpress_test/" /tmp/wordpress-tests-lib/wp-tests-config.php
          sed -i "s/yourusernamehere/root/" /tmp/wordpress-tests-lib/wp-tests-config.php
          sed -i "s/yourpasswordhere/root/" /tmp/wordpress-tests-lib/wp-tests-config.php
          sed -i "s/localhost/127.0.0.1/" /tmp/wordpress-tests-lib/wp-tests-config.php
          sed -i "s|dirname( __FILE__ ) . '/src/'|'/tmp/wordpress/'|" /tmp/wordpress-tests-lib/wp-tests-config.php

      - name: Run PHPUnit
        env:
          WP_TESTS_DIR: /tmp/wordpress-tests-lib
        run: composer test

  e2e:
    name: e2e (WordPress ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.9', '7.1.3']

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: wordpress_e2e
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, curl, zip
          tools: wp-cli

      - name: Install E2E system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip openssl curl

      - name: Install WordPress
        env:
          WP_VERSION: ${{ matrix.wordpress }}
          WP_PATH: /tmp/wp-e2e
        run: |
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --version="$WP_VERSION" --force
          wp config create             --path="$WP_PATH"             --dbname=wordpress_e2e             --dbuser=root             --dbpass=root             --dbhost=127.0.0.1             --skip-check
          wp core install             --path="$WP_PATH"             --url=http://example.test             --title="WordPress Abilities Bridge E2E"             --admin_user=admin             --admin_password='e2e-admin-password'             --admin_email=e2e@example.com             --skip-email

      - name: Install and activate bridge
        env:
          WP_PATH: /tmp/wp-e2e
        run: |
          PLUGIN_DIR="$WP_PATH/wp-content/plugins/wordpress-abilities-bridge"
          mkdir -p "$PLUGIN_DIR"
          cp wp-ability.php "$PLUGIN_DIR/"
          cp -R includes "$PLUGIN_DIR/"
          wp --path="$WP_PATH" plugin activate wordpress-abilities-bridge

      - name: Run real WordPress plugin package E2E
        env:
          WP_PATH: /tmp/wp-e2e
          REPO_ROOT: ${{ github.workspace }}
        run: bash tests/e2e/run.sh

  e2e-multisite:
    name: e2e multisite (WordPress ${{ matrix.wordpress }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        wordpress: ['6.9', '7.1.3']

    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_DATABASE: wordpress_e2e
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP and WP-CLI
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mysqli, curl, zip
          tools: wp-cli

      - name: Install Multisite E2E system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y zip openssl curl

      - name: Install WordPress Multisite
        env:
          WP_VERSION: ${{ matrix.wordpress }}
          WP_PATH: /tmp/wp-e2e-multisite
        run: |
          mkdir -p "$WP_PATH"
          wp core download --path="$WP_PATH" --version="$WP_VERSION" --force
          wp config create --path="$WP_PATH" --dbname=wordpress_e2e --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
          wp core install --path="$WP_PATH" --url=http://example.test --title="WordPress Abilities Bridge Multisite E2E" --admin_user=admin --admin_password='e2e-admin-password' --admin_email=e2e@example.com --skip-email
          wp core multisite-convert --path="$WP_PATH" --title="WordPress Abilities Bridge Network"

      - name: Install and network activate bridge
        env:
          WP_PATH: /tmp/wp-e2e-multisite
        run: |
          PLUGIN_DIR="$WP_PATH/wp-content/plugins/wordpress-abilities-bridge"
          mkdir -p "$PLUGIN_DIR"
          cp wp-ability.php "$PLUGIN_DIR/"
          cp -R includes "$PLUGIN_DIR/"
          wp --path="$WP_PATH" --url=http://example.test plugin activate wordpress-abilities-bridge --network

      - name: Run real WordPress Multisite plugin management E2E
        env:
          WP_PATH: /tmp/wp-e2e-multisite
          REPO_ROOT: ${{ github.workspace }}
        run: bash tests/e2e-multisite/run.sh



  package-smoke:
    name: installable ZIP smoke test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build release-shaped ZIP
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^ \* Version:[[:space:]]*//p' wp-ability.php | head -n 1 | tr -d '\r')"
          rm -rf build dist
          mkdir -p build/wp-ability dist
          cp wp-ability.php build/wp-ability/
          cp -R includes build/wp-ability/
          cp README.md build/wp-ability/
          if [ -f LICENSE ]; then cp LICENSE build/wp-ability/; fi
          ( cd build && zip -qr "../dist/wp-ability-${version}.zip" wp-ability )
          unzip -t "dist/wp-ability-${version}.zip"
          unzip -Z1 "dist/wp-ability-${version}.zip" | grep -qx 'wp-ability/wp-ability.php'
          unzip -Z1 "dist/wp-ability-${version}.zip" | grep -qx 'wp-ability/includes/class-ability-registrar.php'
          if unzip -Z1 "dist/wp-ability-${version}.zip" | grep -Eq '(^|/)(\.git|\.github|tests|vendor)/'; then
            echo "::error::Development files leaked into release ZIP."
            exit 1
          fi
